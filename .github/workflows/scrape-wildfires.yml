name: Scrape Live Wildfire Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.1.7
        with:
          token: ${{ secrets.MAP_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.1.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Wildfire Scraper
        run: python scraper.py

      - name: Commit and Push changes
        env:
          MAP_TOKEN: ${{ secrets.MAP_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage root data files generated by scraper.py
          git add ffs_active_fires.geojson ffs_active_fires.json ffs_active_fires.csv

          # Also stage data/ if scraper outputs anything there
          if [ -d "data" ]; then git add data/; fi

          # Only commit and push if staged files have changes
          if ! git diff --staged --quiet; then
            git commit -m "Automated wildfire data refresh [skip ci]"
            git push "https://${MAP_TOKEN}@github.com/SunSentinel/wildfire-tracking-map.git" HEAD:main
          else
            echo "No changes in wildfire data to commit."
          fi

      - name: Force GitHub Pages to Rebuild
        env:
          MAP_TOKEN: ${{ secrets.MAP_TOKEN }}
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $MAP_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/SunSentinel/wildfire-tracking-map/pages/builds