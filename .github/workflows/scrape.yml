name: Hourly Wildfire Data Scraper

on:
  schedule:
    # Runs at minute 15 of every hour (e.g., 1:15, 2:15, 3:15)
    # Using minute 15 avoids delay congestion at the top of the hour
    - cron: '15 * * * *'
  workflow_dispatch: # Allows you to trigger the scraper manually from the GitHub UI

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 4. Run the scraper script
      - name: Execute Scraper
        run: python scraper.py

      # 5. Commit and push updated GeoJSON data if changed
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add ffs_active_fires.geojson ffs_active_fires.json ffs_active_fires.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update wildfire data [skip ci]" && git push)